  # Nuxt 5 nightly and vite-hub 0.1.0 ask for different Nitro and h3 builds. Keep one of each.
  nitro: 3.0.261103-rc
  h3: 2.0.8

# Only these packages may run install scripts.
allowBuilds:
  esbuild: true
  workerd: true
  "@parcel/watcher": true
  better-sqlite3: true
  vue-demi: false
  "@anthropic-ai/claude-code": true

# Fixes and features ViteHub lacks today, to upstream to vite-hub/vitehub. See patches/README.md.
patchedDependencies:
  "@vite-hub/agent@0.0.0-preview-fe7db29": patches/@vite-hub__agent@0.0.0-preview-fe7db29.patch
  '@nuxt/fonts@0.14.0': patches/@nuxt__fonts@0.14.0.patch

