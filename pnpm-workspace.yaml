# pkg.pr.new tarballs depend on other pkg.pr.new tarballs.
blockExoticSubdeps: false

# ViteHub's generated server code imports @vite-hub/* packages from the app root, which the app doesn't list.
# Hoist them, or resolution walks up out of the project (findings-v1.md).
publicHoistPattern:
  - "@vite-hub/*"

packages:
  - site
  - cli

overrides:
  # vitehub:start
  "vite-hub": https://pkg.pr.new/vite-hub/vitehub/vite-hub@fe7db2946eff63a08aab8afa2469d457f580a0e8
