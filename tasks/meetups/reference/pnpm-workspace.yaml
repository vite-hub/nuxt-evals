# Only these packages may run install scripts.
allowBuilds:
  esbuild: true
  "@parcel/watcher": true
  vue-demi: false

# pkg.pr.new tarballs depend on other pkg.pr.new tarballs.
blockExoticSubdeps: false

# ViteHub's generated server code imports @vite-hub/* packages from the app root.
publicHoistPattern:
  - "@vite-hub/*"

minimumReleaseAgeExclude:
  - nuxt-nightly@5.0.0-2611070044-e3875e8
  - "@nuxt/kit-nightly@5.0.0-2611070044-e3875e8"
  - "@nuxt/nitro-server-nightly@5.0.0-2611070044-e3875e8"
  - "@nuxt/schema-nightly@5.0.0-2611070044-e3875e8"
  - "@nuxt/vite-builder-nightly@5.0.0-2611070044-e3875e8"
  - "@nuxt/vite-server-nightly@5.0.0-2611070044-e3875e8"
  - "@nuxt/cli-nightly"

