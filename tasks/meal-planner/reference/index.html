<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Plan the week's meals, scale recipes and make the shopping list. Everything stays on your device." />
    <meta name="theme-color" content="#e4572e" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>Meal planner</title>
    <script>
      // Paint the saved color mode before the app loads, so dark mode never flashes light. The app owns it from then on.
      try {
        var mode = JSON.parse(localStorage.getItem("meal-planner:settings")).data.colorMode
        var dark = mode === "dark" || (mode !== "light" && matchMedia("(prefers-color-scheme: dark)").matches)
        document.documentElement.classList.add(dark ? "dark" : "light")
      }
      catch (error) {
        // No settings yet: follow the system.
        document.documentElement.classList.add(matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light")
      }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
